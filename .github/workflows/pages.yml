name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to publish to Pages (pages) and to mint the OIDC token
# that proves the deployment came from this workflow (id-token).
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already in flight; let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # The wasm-pack build below targets wasm32.
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build the WebAssembly module
        run: npm run wasm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Type-check and build the frontend
        run: npm run build
        env:
          # A project site is served from /<repo>/, which `base_path` reports
          # (empty string when the site is served from the root).
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
